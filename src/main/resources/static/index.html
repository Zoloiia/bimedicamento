<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/styles.css">
    <title>Gestión de Medicamentos</title>
</head>
<body>

    <!-- ENCABEZADO -->
    <h1>Sistema de Gestión de Medicamentos</h1>
    <hr>

    <!-- SECCIÓN 1: FORMULARIO (app.js lo envía con fetch, sin recargar) -->
    <h2 id="titulo-formulario">Registrar Nuevo Medicamento</h2>

    <form id="formulario">

        <!-- Oculto: guarda el ID cuando se EDITA. Vacío = registro nuevo -->
        <input type="hidden" id="id">

        <div>
            <label for="nombre">Nombre del Medicamento:</label><br>
            <input type="text" id="nombre" name="nombre" placeholder="Ej. Paracetamol" required>
        </div>
        <br>

        <div>
            <label for="laboratorio">Laboratorio / Marca:</label><br>
            <input type="text" id="laboratorio" name="laboratorio" placeholder="Ej. Bayer" required>
        </div>
        <br>

        <div>
            <label for="stock">Cantidad en Stock:</label><br>
            <input type="number" id="stock" name="stock" min="0" placeholder="Ej. 50" required>
        </div>
        <br>

        <!-- NUEVO: debajo de este número sale la alerta -->
        <div>
            <label for="stockMinimo">Stock Mínimo (alerta):</label><br>
            <input type="number" id="stockMinimo" name="stockMinimo" min="0" value="10" required>
        </div>
        <br>

        <div>
            <label for="precio">Precio (S/):</label><br>
            <input type="number" id="precio" name="precio" min="0" step="0.01" placeholder="Ej. 12.50" required>
        </div>
        <br>

        <button type="submit" id="btn-guardar">Guardar Medicamento</button>
        <button type="button" id="btn-cancelar" hidden>Cancelar edición</button>

        <!-- Mensajes de éxito o error -->
        <p id="mensaje" role="status"></p>

    </form>

    <hr>

    <!-- SECCIÓN 2: TABLA. El <tbody> está vacío: app.js lo llena desde PostgreSQL -->
    <h2>Lista de Medicamentos Registrados</h2>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Laboratorio</th>
                <th>Stock</th>
                <th>Stock Mín.</th>
                <th>Precio</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tabla-medicamentos"></tbody>
    </table>

    <!-- app.js va al final, cuando el formulario y la tabla ya existen -->
    <script src="/js/app.js"></script>
</body>
</html>
